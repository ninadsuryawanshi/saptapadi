<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B1A2C" />
      <stop offset="100%" stop-color="#5C0E1B" />
    </linearGradient>
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5E6C0" />
      <stop offset="50%" stop-color="#E8C97A" />
      <stop offset="100%" stop-color="#C9963A" />
    </linearGradient>
  </defs>
  <!-- Rounded gradient background -->
  <rect width="32" height="32" rx="7" fill="url(#bg-gradient)" />
  <!-- Subtle gold inner border -->
  <rect x="1" y="1" width="30" height="30" rx="6" fill="none" stroke="url(#gold-gradient)" stroke-width="0.75" opacity="0.3" />
  <!-- Elegant "S" monogram -->
  <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="'Cinzel', 'Cormorant Garamond', 'Georgia', serif" font-weight="600" font-size="20" fill="url(#gold-gradient)">S</text>
</svg>
